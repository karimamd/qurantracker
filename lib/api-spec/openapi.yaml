          type: integer
          description: 1-based ordinal across the user's Khatmahs.
        startedAt:
          type: string
          format: date-time
        readsInKhatmah:
          type: integer
          description: Number of pages read so far in this Khatmah (0..604).
        pagesPerDay:
          type: integer
          nullable: true
          minimum: 1
          maximum: 604
          description: |
            Per-Khatmah daily page goal. When `null`, the user-level
