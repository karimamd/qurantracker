openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Quran Memorization Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: progress
    description: Quran memorization progress tracking
  - name: settings
    description: User settings
  - name: homework
    description: Homework session tracking
  - name: telawa
    description: Recurring read-only Telawa rotation across all 604 pages
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get user settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /progress/overview:
    get:
      operationId: getProgressOverview
      tags: [progress]
      summary: Dashboard overview of memorization progress
      responses:
        "200":
          description: Progress overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressOverview"

  /progress/juz:
    get:
      operationId: listJuzProgress
      tags: [progress]
      summary: List all 30 juz with aggregated progress
      responses:
        "200":
          description: Juz progress list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JuzProgress"

  /progress/juz/{juzNumber}:
    get:
      operationId: getJuzDetail
      tags: [progress]
      summary: Get detail for a specific juz with its rob3s
      parameters:
        - name: juzNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Juz detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JuzDetail"
        "404":
          description: Juz not found

  /progress/rob3:
    get:
      operationId: listRob3Progress
      tags: [progress]
      summary: List all 240 Rub' al-Hizb (Parts) with aggregated progress
      responses:
        "200":
          description: Rob3 progress list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rob3ProgressItem"

  /progress/surah:
    get:
      operationId: listSurahProgress
      tags: [progress]
      summary: List all 114 surahs with aggregated progress
      responses:
        "200":
          description: Surah progress list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurahProgress"

  /progress/surah/{surahNumber}:
    get:
      operationId: getSurahDetail
      tags: [progress]
      summary: Get a single surah with all its pages
      parameters:
        - name: surahNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Surah detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurahDetail"
        "404":
          description: Surah not found

  /progress/pages:
    get:
      operationId: listPageProgress
      tags: [progress]
      summary: List pages with progress, filterable
      parameters:
        - name: juz
          in: query
          required: false
          schema:
            type: integer
        - name: surah
          in: query
          required: false
          schema:
            type: integer
        - name: inScope
          in: query
          required: false
          schema:
            type: boolean
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [overdue, due_soon, on_track, not_started]
      responses:
        "200":
          description: Page progress list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageProgress"

  /progress/pages/{pageNumber}:
    patch:
      operationId: updatePageProgress
      tags: [progress]
      summary: Record a recitation for a page
      parameters:
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordRecitationBody"
      responses:
        "200":
          description: Updated page progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProgress"

  /progress/pages/{pageNumber}/name:
    put:
      operationId: renamePage
      tags: [progress]
      summary: Set or clear a custom name for a page
      parameters:
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenamePageBody"
      responses:
        "200":
          description: Updated page progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProgress"

  /progress/recite-batch:
    post:
      operationId: recordBatchRecitation
      tags: [progress]
      summary: Record recitation for multiple pages at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRecitationBody"
      responses:
        "200":
          description: Updated pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageProgress"

  /progress/scope:
    post:
      operationId: addToScope
      tags: [progress]
      summary: Add pages to memorization scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeBody"
      responses:
        "200":
          description: Updated pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageProgress"
    delete:
      operationId: removeFromScope
      tags: [progress]
      summary: Remove pages from memorization scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeBody"
      responses:
        "200":
          description: Updated pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageProgress"

  /homework:
    get:
      operationId: listHomework
      tags: [homework]
      summary: List homework sessions
      responses:
        "200":
          description: Homework sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HomeworkSession"
    post:
      operationId: createHomework
      tags: [homework]
      summary: Create a homework session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHomeworkBody"
      responses:
        "201":
          description: Created homework session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkSession"

  /homework/{id}:
    get:
      operationId: getHomework
      tags: [homework]
      summary: Get homework session with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Homework session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkSessionDetail"
        "404":
          description: Not found
    patch:
      operationId: updateHomework
      tags: [homework]
      summary: Update homework session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHomeworkBody"
      responses:
        "200":
          description: Updated homework session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkSession"
    delete:
      operationId: deleteHomework
      tags: [homework]
      summary: Delete homework session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /homework/{id}/ayahs:
    get:
      operationId: getHomeworkAyahs
      tags: [homework]
      summary: List every ayah on a homework's pages with its per-ayah status
      description: >
        Returns all ayahs belonging to the pages in this homework session
        (full scope), each annotated with its current active statuses
        (cleared / memorization / link), the timestamp of the most recent
        active status, and how many times it was attempted in the trailing
        7 days. `lastVisitedGlobalAyahNumber` is the ayah with the most
        recent active mark. Ayah text / surah name are resolved client-side
        from the bundled quran dump.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Homework ayah list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkAyahList"
        "404":
          description: Not found

  /homework/{homeworkId}/items/{itemId}:
    patch:
      operationId: updateHomeworkItem
      tags: [homework]
      summary: Update a homework item (mark page as done)
      parameters:
        - name: homeworkId
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHomeworkItemBody"
      responses:
        "200":
          description: Updated homework item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkItem"

  /progress/daily-chart:
    get:
      operationId: getDailyChart
      tags: [progress]
      summary: Daily distinct pages recited (last N days)
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Daily chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyChartEntry"

  /progress/progress-chart:
    get:
      operationId: getProgressChart
      tags: [progress]
      summary: Per-day overdue count (state of day) and distinct pages recited that day, over the last N days
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Progress chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressChartEntry"

  /progress/pages/{pageNumber}/active-mistakes:
    get:
      operationId: listActivePageMistakes
      tags: [progress]
      summary: List currently active (unresolved) per-ayah mistake marks for a page
      parameters:
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active marks for this page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveAyahMistake"
    post:
      operationId: addActivePageMistake
      tags: [progress]
      summary: Mark an ayah on this page with a mistake (idempotent — re-applying does nothing)
      parameters:
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AyahMistakeInput"
      responses:
        "200":
          description: Updated active marks for this page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveAyahMistake"
    delete:
      operationId: removeActivePageMistake
      tags: [progress]
      summary: Resolve (un-mark) an active per-ayah mistake on this page
      parameters:
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveActiveMistakeBody"
      responses:
        "200":
          description: Updated active marks for this page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveAyahMistake"

  /progress/pages/{pageNumber}/active-mistakes/all:
    delete:
      operationId: clearAllActivePageMistakes
      tags: [progress]
      summary: Resolve every active mark (mistake / link / cleared) on this page in one shot
      parameters:
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated active marks for this page (always empty after a successful clear)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveAyahMistake"

  /progress/mistakes:
    get:
      operationId: getMistakes
      tags: [progress]
      summary: List per-ayah mistakes with summary analytics
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [memorization, link]
      responses:
        "200":
          description: Mistakes summary and list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MistakesResponse"

  /progress/activity:
    get:
      operationId: getRecentActivity
      tags: [progress]
      summary: Recent recitation activity feed
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"

  /progress/activity/{id}:
    delete:
      operationId: undoRecitation
      tags: [progress]
      summary: Undo a recitation by deleting its log entry and recomputing the page's progress from the remaining log history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recomputed page progress for the affected page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProgress"
        "404":
          description: Activity entry not found

  /telawa/today:
    get:
      operationId: getTelawaToday
      tags: [telawa]
      summary: Get today's Telawa batch and rotation cursor
      responses:
        "200":
          description: Today's Telawa batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelawaToday"

  /telawa/read:
    post:
      operationId: recordTelawaRead
      tags: [telawa]
      summary: Mark a page as read in the Telawa rotation
      description: |
        Records a Telawa read for any page (1..604). Reads do not need to be
        sequential — the suggested cursor (derived from the total read count)
        advances by one regardless of which page was logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordTelawaReadBody"
      responses:
        "200":
          description: Updated today's Telawa batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelawaToday"

  /telawa/read/last:
    delete:
      operationId: undoTelawaRead
      tags: [telawa]
      summary: Undo the most recent Telawa read entry
      responses:
        "200":
          description: Updated today's Telawa batch after undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelawaToday"
        "404":
          description: Nothing to undo

  /telawa/khatmah:
    post:
      operationId: startKhatmah
      tags: [telawa]
      summary: Start a new Khatmah from any page
      description: |
        Begins a new Khatmah (a full 604-page rotation) starting from the
        chosen page. The recurring Telawa rotation continues from this page
        and wraps at 604 → 1. If the active Khatmah has zero reads, its start
        page is updated in place; otherwise it is closed and a new Khatmah is
        opened.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartKhatmahBody"
      responses:
        "200":
          description: Updated today's Telawa batch reflecting the new Khatmah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelawaToday"

  /telawa/khatmah/active:
    patch:
      operationId: updateActiveKhatmah
      tags: [telawa]
      summary: Update fields on the active Khatmah
      description: |
        Adjust per-Khatmah settings (currently the daily page goal) without
        starting a new Khatmah. Applies to the user's currently-active
        Khatmah row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActiveKhatmahBody"
      responses:
        "200":
          description: Updated today's Telawa batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelawaToday"

  /telawa/stats:
    get:
      operationId: getTelawaStats
      tags: [telawa]
      summary: Get Telawa stats (totals, current cycle, last 30 days activity)
      responses:
        "200":
          description: Telawa stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelawaStats"

  /telawa/scope/today:
    get:
      operationId: getTelawaScopeToday
      tags: [telawa]
      summary: Get today's In-Scope Round-Robin batch and cycle progress
      description: |
        The In-Scope Round-Robin cycles through only the pages currently in
        the user's memorization scope (page_progress.in_scope = true), with a
        daily page goal. A page counts as read this cycle when it has either an
        explicit Telawa-scope read or any quality recitation since the cycle
        started. When every in-scope page is covered, the cycle auto-completes
        and the next one opens.
      responses:
        "200":
          description: Today's In-Scope Round-Robin batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelawaScopeToday"

  /telawa/scope/read:
    post:
      operationId: recordTelawaScopeRead
      tags: [telawa]
      summary: Mark an in-scope page as read in the round-robin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordTelawaScopeReadBody"
      responses:
        "200":
          description: Updated today's In-Scope Round-Robin batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelawaScopeToday"

  /telawa/scope/read/last:
    delete:
      operationId: undoTelawaScopeRead
      tags: [telawa]
      summary: Undo the most recent explicit In-Scope Round-Robin read entry
      responses:
        "200":
          description: Updated today's In-Scope Round-Robin batch after undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelawaScopeToday"
        "404":
          description: Nothing to undo

  /telawa/scope/active:
    patch:
      operationId: updateActiveScopeCycle
      tags: [telawa]
      summary: Update fields on the active In-Scope Round-Robin cycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScopeCycleBody"
      responses:
        "200":
          description: Updated today's In-Scope Round-Robin batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelawaScopeToday"

  /telawa/homework-reading:
    get:
      operationId: getTelawaHomeworkReading
      tags: [telawa]
      summary: Get Homework reading-goal progress across active homework pages
      description: |
        Returns the distinct pages drawn from the user's active (not yet
        overdue) homework sessions, each with its weekly read count. The
        weekly count includes both quality recitations and explicit Telawa
        reads in the trailing 7 days.
      responses:
        "200":
          description: Homework reading-goal progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelawaHomeworkReading"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Settings:
      type: object
      properties:
        id:
          type: integer
        excellentDays:
          type: integer
        goodDays:
          type: integer
        hardDays:
          type: integer
        relearnDays:
          type: integer
        language:
          type: string
          enum: [en, ar]
        telawaPagesPerDay:
          type: integer
          description: Number of pages per day for the recurring Telawa (read-only) rotation. Default 5.
        readerFontSize:
          type: integer
          description: Font size in pixels used for the Quran page text in the Reader. Default 24.
        ayahViewFontSize:
          type: integer
          description: Default font size in pixels used for the single-ayah detail page (/ayahs/:n). Default 40.
        bottomNavKeys:
          type: array
          description: Ordered list of nav-item keys shown in the mobile bottom-tab bar. Empty/unknown entries are ignored client-side and the historical default applies.
          maxItems: 5
          items:
            type: string
            enum: [homework, dashboard, telawa, reader, mistakes, juz, rub, surah, pages, ayahs, recite, welcome, settings]
        autoAssignPageFromAyahs:
          type: boolean
          description: When true, the server automatically records a page recitation once every ayah on that page has been marked (cleared or with mistake types) today. Default false.
        mistakesGoodMax:
          type: integer
          minimum: 0
          maximum: 100
          description: Inclusive max total page mistakes (across all ayahs that day) that still maps to "good" when auto-assign runs. 0 always maps to "excellent". Default 2.
        mistakesHardMax:
          type: integer
          minimum: 0
          maximum: 100
          description: Inclusive max total page mistakes that still maps to "hard"; anything above maps to "relearn". Must be ≥ mistakesGoodMax. Default 6.
        autoExpireAyahMarks:
          type: boolean
          description: When true, per-ayah marks (cleared/mistake/link) older than 14 days are excluded from the active list shown in the Reader and Ayah detail screens. Page recitation status is unaffected. Default false.
        homeworkWeeklyReadGoal:
          type: integer
          minimum: 1
          maximum: 50
          description: Global weekly per-page read target for Homework pages. A page's weekly progress counts both quality recitations and explicit Telawa reads in the trailing 7 days. Default 3.
        duePagesSectionCollapsed:
          type: boolean
          description: When true (default), surah groups in the "Pages Requiring Attention" dashboard section start collapsed. When false, they start expanded (legacy behavior).
      required:
        - id
        - excellentDays
        - goodDays
        - hardDays
        - relearnDays
        - language
        - telawaPagesPerDay
        - readerFontSize
        - ayahViewFontSize
        - bottomNavKeys
        - autoAssignPageFromAyahs
        - mistakesGoodMax
        - mistakesHardMax
        - autoExpireAyahMarks
        - homeworkWeeklyReadGoal
        - duePagesSectionCollapsed

    UpdateSettingsBody:
      type: object
      properties:
        excellentDays:
          type: integer
        goodDays:
          type: integer
        hardDays:
          type: integer
        relearnDays:
          type: integer
        language:
          type: string
          enum: [en, ar]
        telawaPagesPerDay:
          type: integer
          minimum: 1
          maximum: 604
        readerFontSize:
          type: integer
          minimum: 14
          maximum: 64
        ayahViewFontSize:
          type: integer
          minimum: 14
          maximum: 96
        bottomNavKeys:
          type: array
          maxItems: 5
          items:
            type: string
            enum: [homework, dashboard, telawa, reader, mistakes, juz, rub, surah, pages, ayahs, recite, welcome, settings]
        autoAssignPageFromAyahs:
          type: boolean
        mistakesGoodMax:
          type: integer
          minimum: 0
          maximum: 100
        mistakesHardMax:
          type: integer
          minimum: 0
          maximum: 100
        autoExpireAyahMarks:
          type: boolean
        homeworkWeeklyReadGoal:
          type: integer
          minimum: 1
          maximum: 50
        duePagesSectionCollapsed:
          type: boolean

    ProgressOverview:
      type: object
      properties:
        totalPages:
          type: integer
        pagesInScope:
          type: integer
        pagesOverdue:
          type: integer
        pagesDueSoon:
          type: integer
